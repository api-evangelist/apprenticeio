aid: apprenticeio
name: apprentice.io
description: >-
  Apprentice.io is an AI-native manufacturing platform for the regulated
  life-sciences, pharmaceutical, and biotech industries, headquartered in Jersey
  City, New Jersey. Its flagship Tempo Manufacturing Cloud spans the ISA-95 stack
  with a Manufacturing Execution System (MES), Laboratory Execution System (LES),
  Augmented Work Instructions (AWI), the Tandem remote-assistance and
  collaboration tool, a Connected Manufacturing Network (CMN), edge devices, and
  Manufacturing Intelligence analytics. The A1 agent layer adds AI assistants for
  operators, quality, MSAT, supervisors, engineering, maintenance, and supply
  chain to automate mission-critical workflows, respond to alarms, eliminate
  paperwork, and prevent exceptions. The platform is SOC 2 Type II and ISO
  27001:2022 certified, GDPR compliant, and validated for GMP/cGxP and FDA 21 CFR
  Part 11 electronic records. Apprentice exposes a customer-facing Public API for
  integrating Tempo data and metadata with external systems; API access is gated
  to customers via their delivery lead rather than published on a public
  developer portal. Apprentice is backed by Insight Partners.
